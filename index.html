<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 Safe Guard - Dead Man's Switch</title>
    <!-- Tailwind CSS for clean layout -->
    <script src="https://jsdelivr.net"></script>
    <!-- CryptoJS Library for Zero-Knowledge Encryption -->
    <script src="https://cloudflare.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">🔒 Dead Man's Switch Vault</h2>
        
        <!-- Step 1: User Login/Email -->
        <div class="mb-4">
            <label class="block text-sm font-semibold text-gray-700 mb-1">Your Email (For Verification OTP)</label>
            <input type="email" id="userEmail" placeholder="name@example.com" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-black">
        </div>

        <!-- Step 2: Secret Message -->
        <div class="mb-4">
            <label class="block text-sm font-semibold text-gray-700 mb-1">Your Secret Message</label>
            <textarea id="secretMessage" placeholder="Write your passwords, assets location, or message here..." rows="4" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-black"></textarea>
        </div>

        <!-- Step 3: Recipient Details -->
        <div class="mb-6">
            <label class="block text-sm font-semibold text-gray-700 mb-1">Nominee/Recipient Email</label>
            <input type="email" id="recipientEmail" placeholder="nominee@example.com" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-black">
        </div>

        <!-- Action Button -->
        <button onclick="encryptAndSave()" class="w-full bg-black text-white py-3 rounded-lg font-semibold hover:bg-gray-800 transition duration-200">
            Encrypt & Lock Message
        </button>
        
        <p class="text-xs text-gray-500 mt-4 text-center">
            *Note: Your message is encrypted inside your browser before sending. Even the Admin cannot read it.
        </p>
    </div>

    <script>
        function encryptAndSave() {
            const email = document.getElementById('userEmail').value;
            const message = document.getElementById('secretMessage').value;
            const recipient = document.getElementById('recipientEmail').value;

            if(!email || !message || !recipient) {
                alert("Please fill all fields!");
                return;
            }

            // Zero-Knowledge Magic: Browser ke andar hi data lock ho raha hai!
            const ciphertext = CryptoJS.AES.encrypt(message, email).toString();
            
            console.log("Encrypted Kachra Text:", ciphertext);
            alert("Success! Message converted into secure ciphertext. Ready to send to database.");
        }
    </script>
</body>
</html>
